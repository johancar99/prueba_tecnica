version: "3.9"

# ---------------------------------------------------------------------------
# Estrategia de variables de entorno (tres capas):
#
#   /.env            → Solo Docker Compose: puertos y credenciales de DB
#   /backend/.env    → Variables internas de NestJS
#   /frontend/.env   → Variables internas de Next.js
#
# Red interna: los servicios se comunican usando su nombre como hostname.
#   backend → db       (host: "db")
#   frontend → backend (host: "backend", solo para llamadas server-side)
# ---------------------------------------------------------------------------

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:

services:
  # -------------------------------------------------------------------------
  # BASE DE DATOS
  # Lee credenciales del /.env (nivel orquestación)
  # -------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # BACKEND (NestJS + Prisma)
  # Carga su propio /backend/.env con las variables de la aplicación.
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./backend/.env        # Variables internas de NestJS
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    volumes:
      # Código + node_modules en el host: el LSP ve tipos; npm install en el contenedor escribe aquí.
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network
    command: >
      sh -c "
        npm install &&
        npx prisma generate &&
        npx prisma migrate deploy &&
        npx prisma db seed &&
        npm run start:dev
      "

  # -------------------------------------------------------------------------
  # FRONTEND (Next.js)
  # Carga su propio /frontend/.env con las variables de la aplicación.
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./frontend/.env       # Variables internas de Next.js
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
    networks:
      - app_network
    command: >
      sh -c "
        npm install &&
        npm run dev
      "
